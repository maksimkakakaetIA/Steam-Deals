<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam Скидки — PRO</title>
<style>
:root{--bg:#0b1220;--surface:#141d31;--text:#e8eefc;--muted:#8fa0c4;--accent:#66c0f4;--accent2:#a4d007;--border:#243251;--danger:#e74c3c;--gold:#f1c40f;--purple:#7b4dff}
[data-theme="light"]{--bg:#eef3fb;--surface:#fff;--text:#13203a;--muted:#5a6b8c;--accent:#1b7fc4;--accent2:#5c7a00;--border:#d3ddef;--danger:#d32f2f;--gold:#d4ac0d}
[data-theme="night"]{--bg:#000;--surface:#0a0a0a;--text:#777;--muted:#555;--border:#161616;--accent:#333;--accent2:#555;--danger:#600;--gold:#650}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
.blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none;animation:float 18s ease-in-out infinite alternate;z-index:-1}
.b1{background:var(--accent);top:-15vmax;left:-12vmax}.b2{background:var(--purple);bottom:-18vmax;right:-14vmax;animation-delay:-9s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.theme-btn{position:absolute;top:16px;right:16px;z-index:100;width:40px;height:40px;border-radius:50%;padding:0;font-size:18px}
main{position:relative;max-width:1400px;margin:0 auto;padding:28px 14px 60px}
h1{text-align:center;font-size:clamp(28px,6vw,48px);margin:10px 0 6px;background:linear-gradient(90deg,var(--accent),#c7a6ff,var(--accent2),var(--accent));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.live{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:18px}
.badge{background:var(--surface);border:1px solid var(--border);padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent2)}100%{box-shadow:0 0 0 12px transparent}}
#siteOnline{display:inline-block;color:var(--accent);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#siteOnline.up{transform:translateY(-4px) scale(1.15);color:var(--accent2)}
.panel{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;background:var(--surface);padding:14px;border-radius:16px;border:1px solid var(--border)}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
select,input,button{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;transition:all .2s;outline:none;cursor:pointer;white-space:nowrap}
select:hover,input:hover,button:hover{transform:translateY(-1px);border-color:var(--accent)}
input[type=search]{width:180px;border-radius:20px}input[type=number]{width:110px;border-radius:20px}
label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;border:1px solid var(--border);padding:6px 12px;border-radius:8px}
label input{width:auto;margin:0}
.on{background:var(--accent)!important;color:#0b1220!important;border-color:var(--accent)!important;font-weight:700}
#btnRec{background:linear-gradient(90deg,#e74c3c,#e67e22);color:#fff;border:0}
#btnRandom{background:linear-gradient(90deg,var(--purple),var(--accent));color:#fff;border:0;font-weight:700}
#btnFav.on{background:var(--gold)!important}#btnHid.on{background:var(--danger)!important;color:#fff!important}
.count{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:980px}
th{background:var(--surface);text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);padding:12px 10px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--border)}
th:hover,th.s{color:var(--accent)}
td{padding:10px;border-bottom:1px solid var(--border);font-size:14px;white-space:nowrap;vertical-align:middle}
tr.row{animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateX(-12px)}}
tr.row:hover{background:rgba(102,192,244,.09)}
td.g{white-space:normal;min-width:260px}
.gi{display:flex;align-items:center;gap:12px}
.img{width:120px;height:56px;border-radius:6px;background:var(--border);flex-shrink:0;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.gi a{color:var(--text);text-decoration:none;font-weight:600;font-size:15px}.gi a:hover{color:var(--accent)}
.pill{display:inline-block;min-width:54px;text-align:center;padding:4px 8px;border-radius:7px;font-weight:800;color:#10170a;background:var(--accent2)}
.pill.m{background:#f1c40f}.pill.l{background:#e67e22}
b.pr{color:var(--accent2);font-size:15px}s{color:var(--muted);margin-left:6px}
.tag{display:inline-block;background:var(--border);color:var(--muted);font-size:11px;padding:2px 6px;border-radius:4px;margin:4px 4px 0 0}
.tm{display:inline-block;color:#e67e22;font-size:12px;font-weight:700;margin-top:4px}
.rt{display:flex;align-items:center;gap:8px}.rb{width:64px;height:6px;border-radius:9px;background:var(--border);overflow:hidden}.rb i{display:block;height:100%;border-radius:9px}
.ba{background:transparent;border:1px solid transparent;font-size:16px;padding:4px 7px;color:var(--muted)}.ba:hover{color:var(--text);background:rgba(255,255,255,.08)}
.msg{text-align:center;color:var(--muted);padding:40px}
.sp{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#more{height:1px}
#toasts{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--accent2);padding:12px 20px;border-radius:12px;display:flex;align-items:center;gap:15px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(20px);transition:all .3s}
.toast.show{opacity:1;transform:none}.toast button{background:var(--accent2);color:#0b1220;border:0;font-weight:700;padding:6px 12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.show{opacity:1;pointer-events:auto}
.mc{background:var(--surface);border:1px solid var(--border);padding:26px;border-radius:20px;max-width:500px;width:90%;text-align:center}
.mc img{width:100%;border-radius:12px;margin-bottom:14px}
#mT{font-size:22px;font-weight:700;margin-bottom:8px}#mP{font-size:18px;color:var(--accent2);font-weight:700;margin-bottom:18px}
.go{display:block;background:var(--accent);color:#0b1220;text-decoration:none;padding:12px;border-radius:10px;font-weight:700;margin-bottom:10px}
.cl{background:none;border:0;color:var(--muted);text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:800px){
.tw{background:none;border:0;overflow:visible}table,thead,tbody,tr,td{display:block;width:100%;min-width:0}thead{display:none}
tr.row{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;padding:12px}
td{border:0;padding:0;white-space:normal;margin-bottom:6px}
td:nth-child(1){position:absolute;top:8px;right:8px;width:auto;margin:0;z-index:2}
td.g{padding-right:34px}.img{width:90px;height:42px}
td:nth-child(n+3):nth-child(-n+7){display:inline-block;width:auto;margin-right:12px}
td:nth-child(8){display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px;margin:6px 0 0}
.row2{flex-direction:column;width:100%}select,input,button,label{width:100%;justify-content:center}input[type=search],input[type=number]{border-radius:8px}}
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" title="Сменить тему">🌓</button>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
<h1>Steam Скидки PRO</h1>
<div class="live">
<div class="badge"><span class="dot"></span><span id="status">Загрузка…</span></div>
<div class="badge">👀 На сайте: <b id="siteOnline">1</b></div>
</div>
<div class="panel">
<div class="row2">
<select id="reg"><option value="ru">🇷🇺 RUB</option><option value="us">🇺🇸 USD</option><option value="de">🇪🇺 EUR</option><option value="ua">🇺🇦 UAH</option><option value="kz">🇰🇿 KZT</option><option value="gb">🇬🇧 GBP</option><option value="pl">🇵🇱 PLN</option><option value="tr">🇹🇷 TRY</option></select>
<input id="q" type="search" placeholder="Поиск игры…">
<select id="tag"><option value="all">Все жанры</option></select>
<select id="md"><option value="0">Скидка от 0%</option><option value="25">От 25%</option><option value="50">От 50%</option><option value="75">От 75%</option><option value="90">От 90%</option></select>
<input id="mp" type="number" min="0" placeholder="Цена до…">
</div>
<div class="row2">
<label><input type="checkbox" id="ruF"> 🇷🇺 Русский</label>
<label><input type="checkbox" id="baseF"> Только игры</label>
<button id="btnSoon">⏳ Успеть купить</button>
<button id="btnProfit">💎 Выгода</button>
<button id="btnRec">🔥 Рекомендации</button>
<button id="btnFav">⭐ Избранное</button>
<button id="btnHid">🗑 Скрытые</button>
<button id="btnRandom">🎲 Рулетка</button>
<button id="refresh">↻ Обновить</button>
<button id="btnReset">Сброс</button>
</div>
</div>
<div class="count" id="count"></div>
<div class="tw"><table>
<thead><tr><th style="text-align:center">⭐</th><th data-k="n">Игра</th><th data-k="d">Скидка</th><th data-k="p">Цена</th><th data-k="r">Рейтинг</th><th data-k="v">Отзывы</th><th>Онлайн</th><th style="text-align:center">Действия</th></tr></thead>
<tbody id="tb"></tbody></table></div>
<div id="more" hidden></div>
</main>
<div class="ov" id="modal"><div class="mc"><img id="mI" alt=""><div id="mT"></div><div id="mP"></div><a id="mL" class="go" target="_blank" rel="noopener">Перейти в Steam</a><button class="cl" id="mC">Закрыть</button></div></div>
<div id="toasts"></div>
<script>
var $=function(i){return document.getElementById(i)};
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v,function(n,x){return n==="_n"?undefined:x}))}catch(e){}}};
function raw(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}

/* ---------- Тема ---------- */
var root=document.documentElement,theme=raw("steam_theme","system");
function applyTheme(){
  var dark=matchMedia("(prefers-color-scheme: dark)").matches,t=theme,ic="🌓";
  if(t==="light"){root.dataset.theme="light";ic="☀️"}
  else if(t==="night"){root.dataset.theme="night";ic="🌑"}
  else if(t==="dark"){delete root.dataset.theme;ic="🌙"}
  else{if(dark)delete root.dataset.theme;else root.dataset.theme="light"}
  $("themeBtn").textContent=ic;
}
$("themeBtn").onclick=function(){theme={system:"dark",dark:"light",light:"night",night:"system"}[theme];try{localStorage.setItem("steam_theme",theme)}catch(e){}applyTheme()};
applyTheme();

/* ---------- Счётчик онлайна на сайте ---------- */
function online(){
  var uid=raw("steam_uid","");if(!uid){uid=Math.random().toString(36).slice(2,9);try{localStorage.setItem("steam_uid",uid)}catch(e){}}
  fetch("/api/online?uid="+uid).then(function(r){return r.json()}).then(function(d){
    var el=$("siteOnline"),n=String(d.online||1);
    if(el.textContent!==n){el.textContent=n;el.classList.add("up");setTimeout(function(){el.classList.remove("up")},400)}
  }).catch(function(){});
}
online();setInterval(online,15000);

/* ---------- Состояние ---------- */
var data=null,byId=new Map(),list=[],shown=0,PAGE=60,tok=0,sk="d",dir=-1,mode="",view="";
var hidden=new Set(store.get("steam_hidden",[])),fav=new Set(store.get("steam_fav",[]));
var NONBASE=/\b(DLC|Soundtrack|OST|Artbook|Season Pass|Expansion Pass|Demo)\b/i,CACHE=30*60*1000;
var nf={};
function money(v){var c=data&&data.cur||"USD";try{nf[c]=nf[c]||new Intl.NumberFormat("ru-RU",{style:"currency",currency:c,maximumFractionDigits:2});var s=nf[c].format(v);return s.replace(/[,.]00(?=\D*$)/,"")}catch(e){return v.toFixed(2)}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function timer(e){if(!e)return"";var d=e-Math.floor(Date.now()/1000);if(d<0)return"⏳ скоро конец";var D=Math.floor(d/86400),H=Math.floor(d%86400/3600),M=Math.floor(d%3600/60);return D?"⏳ "+D+" д. "+H+" ч.":H?"⏳ "+H+" ч. "+M+" мин.":"⏳ "+M+" мин."}
function toast(msg,label,fn){
  var t=document.createElement("div");t.className="toast";t.innerHTML="<span>"+msg+"</span><button>"+label+"</button>";
  $("toasts").appendChild(t);setTimeout(function(){t.classList.add("show")},10);
  t.querySelector("button").onclick=function(){fn();t.remove()};
  setTimeout(function(){t.classList.remove("show");setTimeout(function(){t.remove()},300)},4000);
}
function saveFilters(){store.set("steam_filters",{reg:$("reg").value,q:$("q").value,md:$("md").value,mp:$("mp").value,ruF:$("ruF").checked,baseF:$("baseF").checked})}
(function(){var f=store.get("steam_filters",{});if(f.reg)$("reg").value=f.reg;$("q").value=f.q||"";if(f.md)$("md").value=f.md;$("mp").value=f.mp||"";$("ruF").checked=!!f.ruF;$("baseF").checked=!!f.baseF})();

/* ---------- Загрузка (кэш по региону + постраничный сбор) ---------- */
function setData(cc,cur,items){
  data={cc:cc,cur:cur,items:items};byId=new Map();var tags={};
  items.forEach(function(g){g._n=g.n.toLowerCase();byId.set(g.i,g);(g.t||[]).forEach(function(x){tags[x]=(tags[x]||0)+1})});
  var sel=$("tag"),keep=sel.value;sel.innerHTML='<option value="all">Все жанры</option>'+Object.keys(tags).sort(function(a,b){return tags[b]-tags[a]}).slice(0,40).map(function(x){return'<option>'+esc(x)+'</option>'}).join("");
  sel.value=keep;if(sel.value!==keep)sel.value="all";
  apply();
}
async function load(force){
  var my=++tok,cc=$("reg").value,key="steam_c_"+cc;
  if(!force){var c=store.get(key,null);if(c&&Date.now()-c.t<CACHE&&c.items){setData(cc,c.cur,c.items);$("status").textContent="Из кэша · "+c.items.length+" игр";return}}
  data=null;$("tb").innerHTML='<tr><td colspan="8"><div class="msg"><div class="sp"></div>Собираю скидки из Steam…</div></td></tr>';$("status").textContent="Загрузка…";
  var start=0,total=1,map=new Map(),first=true,cur="";
  try{
    while(start<total&&start<2000){
      var r=await fetch("/api/deals?cc="+cc+"&start="+start),t=await r.text(),j;
      try{j=JSON.parse(t)}catch(x){throw new Error("HTTP "+r.status+": "+(t.slice(0,120)||"пустой ответ"))}
      if(my!==tok)return;if(!r.ok)throw new Error(j.error||r.status);
      j.items.forEach(function(g){map.set(g.i,g)});cur=j.cur;total=j.total;start=j.next;
      $("status").textContent="Загружено "+Math.min(start||total,total)+" из "+total;
      if(first){first=false;setData(cc,cur,Array.from(map.values()))}
      if(!start)break;
    }
    var items=Array.from(map.values());setData(cc,cur,items);
    store.set(key,{t:Date.now(),cur:cur,items:items});
    $("status").textContent="Live · "+items.length+" игр · "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    $("status").textContent="Нет связи со Steam";
    if(!data)$("tb").innerHTML='<tr><td colspan="8"><div class="msg">Ошибка: '+esc(e.message)+'</div></td></tr>';
  }
}

/* ---------- Фильтрация и сортировка ---------- */
function score(g){return g.r*Math.log10(g.v+10)*(g.d/100+.5)}
function apply(){
  if(!data)return;
  var q=$("q").value.trim().toLowerCase(),md=+$("md").value,mp=parseFloat($("mp").value),tag=$("tag").value,ru=$("ruF").checked,base=$("baseF").checked;
  list=data.items.filter(function(g){
    var h=hidden.has(g.i);
    if(view==="hid")return h;if(h)return false;
    if(view==="fav"&&!fav.has(g.i))return false;
    if(g.d<md||(mp===mp&&g.p>mp))return false;
    if(q&&g._n.indexOf(q)<0)return false;
    if(tag!=="all"&&(g.t||[]).indexOf(tag)<0)return false;
    if(ru&&!g.ru)return false;
    if(base&&(g.dlc||NONBASE.test(g.n)))return false;
    if(mode==="soon"&&!g.e)return false;
    if(mode==="rec"&&(g.r<85||g.v<1000))return false;
    return true;
  });
  list.sort(function(a,b){
    if(mode==="soon")return a.e-b.e;
    if(mode==="profit")return(b.o-b.p)-(a.o-a.p);
    if(mode==="rec")return score(b)-score(a);
    var x=a[sk],y=b[sk];if(sk==="n")return dir*x.localeCompare(y);return x===y?b.v-a.v:dir*(x-y);
  });
  [].forEach.call(document.querySelectorAll("th[data-k]"),function(t){t.classList.toggle("s",!mode&&t.dataset.k===sk)});
  $("count").textContent="Найдено "+list.length+" из "+data.items.length+(hidden.size?" · скрыто "+hidden.size:"");
  $("tb").innerHTML="";shown=0;
  if(!list.length)$("tb").innerHTML='<tr><td colspan="8"><div class="msg">Ничего не найдено</div></td></tr>';
  more();
}

/* ---------- Отрисовка строк (порциями + бесконечная прокрутка) ---------- */
function row(g){
  var cls=g.d>=75?"":g.d>=40?" m":" l",col=g.r>=80?"var(--accent2)":g.r>=60?"#f1c40f":"#e74c3c",h=view==="hid";
  var tr=document.createElement("tr");tr.className="row";tr.dataset.id=g.i;
  tr.innerHTML='<td style="text-align:center"><button class="ba" data-a="fav">'+(fav.has(g.i)?"⭐":"☆")+'</button></td>'+
  '<td class="g"><div class="gi"><div class="img"><img loading="lazy" alt="" src="https://cdn.cloudflare.steamstatic.com/steam/apps/'+g.i+'/header.jpg" onerror="this.remove()"></div><div>'+
  '<a target="_blank" rel="noopener" href="https://store.steampowered.com/app/'+g.i+'/?cc='+data.cc+'">'+esc(g.n)+'</a><div>'+
  (g.t||[]).slice(0,3).map(function(x){return'<span class="tag">'+esc(x)+'</span>'}).join("")+(g.e?'<span class="tm">'+timer(g.e)+'</span>':"")+'</div></div></div></td>'+
  '<td><span class="pill'+cls+'">−'+g.d+'%</span></td><td><b class="pr">'+money(g.p)+'</b><s>'+money(g.o)+'</s></td>'+
  '<td><div class="rt"><div class="rb"><i style="width:'+g.r+'%;background:'+col+'"></i></div>'+g.r+'%</div></td><td>'+g.v.toLocaleString("ru-RU")+'</td>'+
  '<td><button class="ba" data-a="online" title="Онлайн сейчас">👥</button></td>'+
  '<td style="text-align:center"><button class="ba" data-a="info" title="Подробнее">ℹ️</button><button class="ba" data-a="copy" title="Копировать ссылку">🔗</button>'+
  '<button class="ba" data-a="'+(h?"restore":"hide")+'" title="'+(h?"Вернуть":"Скрыть")+'">'+(h?"↩️":"🙈")+'</button></td>';
  return tr;
}
function more(){
  var end=Math.min(shown+PAGE,list.length),f=document.createDocumentFragment();
  for(var i=shown;i<end;i++)f.appendChild(row(list[i]));
  $("tb").appendChild(f);shown=end;
  $("more").hidden=shown>=list.length;
  if(!$("more").hidden){io.unobserve($("more"));io.observe($("more"))}
}
var io=new IntersectionObserver(function(es){if(es[0].isIntersecting)more()},{rootMargin:"500px"});

/* ---------- Действия в строках (делегирование) ---------- */
function persist(){store.set("steam_hidden",Array.from(hidden));store.set("steam_fav",Array.from(fav))}
$("tb").addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var tr=b.closest("tr"),id=+tr.dataset.id,g=byId.get(id),a=b.dataset.a;if(!g)return;
  if(a==="fav"){fav.has(id)?fav.delete(id):fav.add(id);persist();if(view==="fav")apply();else b.textContent=fav.has(id)?"⭐":"☆"}
  else if(a==="hide"){hidden.add(id);persist();toast("Скрыта: <b>"+esc(g.n)+"</b>","Отменить",function(){hidden.delete(id);persist();apply()});apply()}
  else if(a==="restore"){hidden.delete(id);persist();apply()}
  else if(a==="info")openModal(g);
  else if(a==="copy"){try{navigator.clipboard.writeText("https://store.steampowered.com/app/"+id+"/");toast("Ссылка скопирована","OK",function(){})}catch(x){}}
  else if(a==="online"){
    b.textContent="…";
    fetch("/api/deals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({appid:id})})
    .then(function(r){return r.json()}).then(function(j){
      var n=j.response&&j.response.player_count;
      if(n===undefined){b.textContent="н/д";return}
      b.textContent=n.toLocaleString("ru-RU");b.style.color="var(--accent2)";b.style.fontWeight="700";b.disabled=true;
    }).catch(function(){b.textContent="ошибка"});
  }
});

/* ---------- Модалка и рулетка ---------- */
function openModal(g){
  $("mI").src="https://cdn.cloudflare.steamstatic.com/steam/apps/"+g.i+"/header.jpg";
  $("mT").textContent=g.n;$("mP").textContent="Цена: "+money(g.p)+" (скидка "+g.d+"%)";
  $("mL").href="https://store.steampowered.com/app/"+g.i+"/?cc="+data.cc;$("modal").classList.add("show");
}
function closeModal(){$("modal").classList.remove("show")}
$("mC").onclick=closeModal;$("modal").onclick=function(e){if(e.target.id==="modal")closeModal()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
$("btnRandom").onclick=function(){if(!list.length)return toast("Нечего выбирать","OK",function(){});openModal(list[Math.floor(Math.random()*list.length)])};

/* ---------- Управление ---------- */
function setMode(m){mode=mode===m?"":m;view="";sync();apply()}
function setView(v){view=view===v?"":v;mode="";sync();apply()}
function sync(){
  [["btnSoon",mode==="soon"],["btnProfit",mode==="profit"],["btnRec",mode==="rec"],["btnFav",view==="fav"],["btnHid",view==="hid"]].forEach(function(p){$(p[0]).classList.toggle("on",p[1])});
}
$("btnSoon").onclick=function(){setMode("soon")};$("btnProfit").onclick=function(){setMode("profit")};$("btnRec").onclick=function(){setMode("rec")};
$("btnFav").onclick=function(){setView("fav")};$("btnHid").onclick=function(){setView("hid")};
$("refresh").onclick=function(){load(true)};
$("btnReset").onclick=function(){$("q").value="";$("md").value="0";$("mp").value="";$("tag").value="all";$("ruF").checked=$("baseF").checked=false;mode=view="";sk="d";dir=-1;sync();saveFilters();apply()};
[].forEach.call(document.querySelectorAll("th[data-k]"),function(t){t.onclick=function(){var k=t.dataset.k;mode="";sync();if(sk===k)dir=-dir;else{sk=k;dir=k==="n"||k==="p"?1:-1}apply()}});
var tm;function deb(){clearTimeout(tm);tm=setTimeout(function(){saveFilters();apply()},200)}
$("q").oninput=deb;$("mp").oninput=deb;
["md","tag","ruF","baseF"].forEach(function(i){$(i).onchange=function(){saveFilters();apply()}});
$("reg").onchange=function(){saveFilters();load()};
load();setInterval(function(){load(true)},CACHE);
</script>
