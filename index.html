<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam Скидки — PRO</title>
<style>
:root{--bg:#0b1220;--surface:#141d31;--text:#e8eefc;--muted:#8fa0c4;--accent:#66c0f4;--accent2:#a4d007;--border:#243251;--danger:#e74c3c;--gold:#f1c40f;--night-bg:#000000;--night-surface:#0a0a0a;--night-text:#555555;--night-border:#111111;}
[data-theme="light"]{--bg:#eef3fb;--surface:#fff;--text:#13203a;--muted:#5a6b8c;--accent:#1b7fc4;--accent2:#5c7a00;--border:#d3ddef;--danger:#d32f2f;--gold:#d4ac0d;}
[data-theme="night"]{--bg:var(--night-bg);--surface:var(--night-surface);--text:var(--night-text);--muted:#444;--border:var(--night-border);--accent:#333;--accent2:#444;--danger:#500;--gold:#500;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;transition:background 0.3s,color 0.3s;}
.blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.25;pointer-events:none;animation:float 18s ease-in-out infinite alternate;z-index:-1;}
.b1{background:var(--accent);top:-15vmax;left:-12vmax}.b2{background:#7b4dff;bottom:-18vmax;right:-14vmax;animation-delay:-9s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.top-bar{position:absolute;top:20px;right:20px;display:flex;gap:10px;z-index:100;}
.theme-btn{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
main{position:relative;max-width:1400px;margin:0 auto;padding:28px 14px 60px}
h1{text-align:center;font-size:clamp(28px,6vw,48px);margin:10px 0 6px;background:linear-gradient(90deg,var(--accent),#c7a6ff,var(--accent2),var(--accent));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.live{display:flex;justify-content:center;align-items:center;gap:15px;color:var(--muted);font-size:14px;margin-bottom:18px}
.badge{background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent2)}100%{box-shadow:0 0 0 12px transparent}}
#siteOnline{display:inline-block;transition:transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s;}
#siteOnline.update-anim{transform:translateY(-4px) scale(1.1);color:var(--accent2);}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;align-items:center;}
select,input,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 14px;transition:transform .2s,border-color .2s;outline:none;cursor:pointer;}
select:hover,input:hover,button:hover{transform:translateY(-2px);border-color:var(--accent)}
input[type=search]{width:180px} input[type=number]{width:100px}
.btn-rec.active{background:linear-gradient(90deg,#e74c3c,#e67e22);color:#fff;border:none;}
.btn-hidden.active{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-fav.active{background:var(--gold);color:#0b1220;border-color:var(--gold);}
.btn-toggle.active{background:var(--accent);color:#0b1220;border-color:var(--accent);}
.btn-reset{background:transparent;border:1px solid var(--muted);color:var(--muted);font-size:13px;padding:6px 12px;}
.count{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,0.1);}
table{width:100%;border-collapse:collapse;min-width:1050px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);padding:12px 10px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--border);z-index:10;}
th:hover{color:var(--accent)} th.on{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:14px;white-space:nowrap;vertical-align:middle;}
tr.row{opacity:0;transform:translateX(-16px);transition:opacity .45s,transform .45s,background .2s}
tr.row.in{opacity:1;transform:none}
tr.row:hover{background:rgba(102,192,244,.09)}
td.g{white-space:normal;min-width:260px}
.gi{display:flex;align-items:center;gap:12px}
.gi .img-box{width:120px;height:56px;border-radius:6px;background:linear-gradient(135deg, var(--surface), var(--border));display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative;}
.gi .img-box img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:2;transition:opacity 0.2s;}
.gi a{color:var(--text);text-decoration:none;font-weight:600}.gi a:hover{color:var(--accent)}
.pill{display:inline-block;min-width:54px;text-align:center;padding:4px 8px;border-radius:7px;font-weight:800;color:#10170a;background:var(--accent2)}
.pill.m{background:#f1c40f}.pill.l{background:#e67e22}
b.pr{color:var(--accent2);font-size:15px} s{color:var(--muted)}
.tag{display:inline-block;background:var(--border);color:var(--muted);font-size:11px;padding:2px 6px;border-radius:4px;margin-right:4px;margin-top:4px;}
.rt{display:flex;align-items:center;gap:8px}
.rb{width:64px;height:6px;border-radius:9px;background:var(--border);overflow:hidden}
.rb i{display:block;height:100%;width:0;border-radius:9px;transition:width 1s .2s}
.timer{color:#e67e22;font-size:12px;font-weight:bold;}
.hltb{color:var(--muted);font-size:11px;text-decoration:none;margin-left:5px;}
.hltb:hover{color:var(--accent);text-decoration:underline;}
.more{display:block;margin:20px auto 0}
.msg{text-align:center;color:var(--muted);padding:40px}
.sp{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-act{background:transparent;border:1px solid transparent;font-size:18px;padding:4px;cursor:pointer;border-radius:6px;transition:background 0.2s;}
.btn-act:hover{background:rgba(255,255,255,0.1);}
.end-row td {text-align:center; padding: 40px; color: var(--muted); font-size: 16px; font-weight: bold; border-bottom: none;}

/* Модалка для рулетки */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-content{background:var(--surface);border:1px solid var(--border);padding:30px;border-radius:20px;max-width:500px;width:90%;text-align:center;transform:translateY(20px);transition:transform 0.3s;box-shadow:0 20px 50px rgba(0,0,0,0.5);}
.modal-overlay.show .modal-content{transform:translateY(0);}
.modal-img{width:100%;border-radius:12px;margin-bottom:15px;}
.modal-title{font-size:22px;font-weight:bold;margin-bottom:10px;}
.modal-price{font-size:18px;color:var(--accent2);margin-bottom:20px;font-weight:bold;}
.modal-btn{display:block;background:var(--accent);color:#0b1220;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;margin-bottom:10px;}
.modal-close{background:transparent;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div class="top-bar">
  <button class="theme-btn" id="themeToggle" title="Сменить тему">🌓</button>
</div>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
<h1>Steam Скидки PRO</h1>

<div class="live">
  <div class="badge"><span class="dot"></span><span id="status">Загрузка…</span></div>
  <div class="badge">👀 На сайте: <b id="siteOnline" style="color:var(--accent);">0</b></div>
</div>

<div class="controls">
<select id="reg"><option value="ru">🇷🇺 RUB</option><option value="us">🇺🇸 USD</option><option value="de">🇪🇺 EUR</option></select>
<input id="q" type="search" placeholder="Поиск игры…">
<select id="tagFilter"><option value="all">Все жанры</option></select>
<select id="md"><option value="0">Скидка от 0%</option><option value="50">От 50%</option><option value="75">От 75%</option></select>
<input id="mp" type="number" min="0" placeholder="Цена до…">
<label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:14px;">
  <input type="checkbox" id="ruFilter" style="width:auto;border-radius:4px;"> 🇷🇺 Русский
</label>
<label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:14px;">
  <input type="checkbox" id="baseGameFilter" style="width:auto;border-radius:4px;"> Только игры
</label>
<button id="btnSoon" class="btn-toggle">⏳ Успеть купить</button>
<button id="btnProfit" class="btn-toggle">💎 Выгода</button>
<button id="refresh">↻ Обновить</button>
<button id="btnRec" class="btn-rec">🔥 Рекомендации</button>
<button id="btnFav" class="btn-fav">⭐ Избранное</button>
<button id="btnShowHidden" class="btn-hidden">🗑 Скрытые</button>
<button id="btnRandom" class="btn-toggle" style="background:linear-gradient(90deg,#7b4dff,#66c0f4);color:#fff;border:none;">🎲 Рулетка</button>
<button id="btnReset" class="btn-reset">Сброс</button>
</div>

<div class="count" id="count"></div>
<div class="tw"><table>
<thead><tr>
  <th style="width:40px; text-align:center;">⭐</th>
  <th data-k="n">Игра</th>
  <th data-k="d">Скидка</th>
  <th data-k="p">Цена</th>
  <th data-k="r">Рейтинг</th>
  <th data-k="v">Отзывы</th>
  <th>Онлайн</th>
  <th style="text-align:center;">Действие</th>
</tr></thead>
<tbody id="tb"></tbody></table></div>
<button class="more" id="more" hidden>Показать ещё</button>
</main>

<!-- Модалка -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <img id="modalImg" class="modal-img" src="" alt="">
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalPrice" class="modal-price"></div>
    <a id="modalLink" href="#" target="_blank" class="modal-btn">Перейти в Steam</a>
    <button class="modal-close" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<div id="toast-container"></div>

<script>
// --- СЧЕТЧИК ОНЛАЙНА ---
let lastOnline = 0;
async function updateSiteCounter() {
  try {
    const r = await fetch("/api/online");
    const data = await r.json();
    const el = document.getElementById('siteOnline');
    if (data.online !== undefined && data.online !== lastOnline) {
      lastOnline = data.online;
      el.textContent = data.online;
      el.classList.remove('update-anim'); void el.offsetWidth; el.classList.add('update-anim');
    }
  } catch(e) {}
}
updateSiteCounter(); setInterval(updateSiteCounter, 15000);

// --- ТЕМЫ (Вкл. Ночную) ---
const root = document.documentElement, themeToggle = document.getElementById('themeToggle');
let currentTheme = localStorage.getItem('steam_theme') || 'system';
function applyTheme(theme) {
  if (theme === 'light') { root.setAttribute('data-theme', 'light'); themeToggle.textContent = '☀️'; }
  else if (theme === 'dark') { root.removeAttribute('data-theme'); themeToggle.textContent = '🌙'; }
  else if (theme === 'night') { root.setAttribute('data-theme', 'night'); themeToggle.textContent = '🌑'; }
  else { const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches; if (isDark) { root.removeAttribute('data-theme'); themeToggle.textContent = '🌓'; } else { root.setAttribute('data-theme', 'light'); themeToggle.textContent = '🌓'; } }
}
applyTheme(currentTheme);
themeToggle.onclick = () => { 
  // Переключение по кругу: system -> dark -> light -> night -> system
  if(currentTheme === 'system') currentTheme = 'dark';
  else if(currentTheme === 'dark') currentTheme = 'light';
  else if(currentTheme === 'light') currentTheme = 'night';
  else currentTheme = 'system';
  localStorage.setItem('steam_theme', currentTheme); applyTheme(currentTheme); 
};

// --- МОДАЛКА ---
function openModal(game) {
  document.getElementById('modalImg').src = `https://cdn.cloudflare.steamstatic.com/steam/apps/${game.i}/header.jpg`;
  document.getElementById('modalTitle').textContent = game.n;
  document.getElementById('modalPrice').textContent = `Цена: ${money(game.p)} (скидка ${game.d}%)`;
  document.getElementById('modalLink').href = `https://store.steampowered.com/app/${game.i}/?cc=${data.cc}`;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

// --- ОСНОВНАЯ ЛОГИКА ---
var $=function(i){return document.getElementById(i)},data=null,sk="d",dir=-1,shown=0,PAGE=60,list=[];
var isRecMode = false, showHiddenOnly = false, showFavOnly = false;
var isSoonMode = false, isProfitMode = false;

var hiddenGames = new Set(JSON.parse(localStorage.getItem('steam_hidden') || "[]"));
var favGames = new Set(JSON.parse(localStorage.getItem('steam_fav') || "[]"));

var savedFilters = JSON.parse(localStorage.getItem('steam_filters') || "{}");
if(savedFilters.reg) $("reg").value = savedFilters.reg;
if(savedFilters.q) $("q").value = savedFilters.q;
if(savedFilters.md) $("md").value = savedFilters.md;
if(savedFilters.mp) $("mp").value = savedFilters.mp;
if(savedFilters.ruFilter) $("ruFilter").checked = true;
if(savedFilters.baseGameFilter) $("baseGameFilter").checked = true;

var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){var r=x.target;r.classList.add("in");var b=r.querySelector(".rb i");if(b)b.style.width=b.dataset.w+"%";io.unobserve(r)}})},{threshold:.05});
function money(v){try{return new Intl.NumberFormat("ru-RU",{style:"currency",currency:data.cur,maximumFractionDigits:v%1?2:0}).format(v)}catch(e){return v.toFixed(2)}}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function saveFilters() { localStorage.setItem('steam_filters', JSON.stringify({ reg: $("reg").value, q: $("q").value, md: $("md").value, mp: $("mp").value, ruFilter: $("ruFilter").checked, baseGameFilter: $("baseGameFilter").checked })); }

function getTimerText(endUnix) {
  if (!endUnix) return "";
  let diff = endUnix - Math.floor(Date.now() / 1000);
  if (diff < 0) return "Скоро закончится";
  let d = Math.floor(diff / 86400); let h = Math.floor((diff % 86400) / 3600);
  if (d > 0) return `Осталось: ${d} д.`;
  if (h > 0) return `Осталось: ${h} ч.`;
  return `Осталось: < 1 ч.`;
}

async function checkOnline(id, btn) {
  btn.textContent = "Ждём...";
  try {
    const r = await fetch("/api/deals", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ appid: id }) });
    const j = await r.json();
    if (j.response && j.response.player_count !== undefined) {
       btn.textContent = j.response.player_count.toLocaleString('ru-RU'); btn.style.color = "var(--accent2)"; btn.style.fontWeight = "bold"; btn.disabled = true;
    } else { btn.textContent = "Нет данных"; }
  } catch(e) { btn.textContent = "Ошибка"; }
}

function copyLink(id, btn) {
  const url = `https://store.steampowered.com/app/${id}/`;
  navigator.clipboard.writeText(url).then(() => {
    btn.style.color = "var(--accent2)";
    showToast(`Ссылка скопирована!`, "OK", ()=>{});
    setTimeout(()=> btn.style.color = "var(--muted)", 2000);
  });
}

function showToast(msg, actionText, actionFn) {
  var container = $("toast-container"), toast = document.createElement("div");
  toast.className = "toast"; toast.innerHTML = `<span>${msg}</span><button>${actionText}</button>`;
  container.appendChild(toast); setTimeout(() => toast.classList.add("show"), 10);
  toast.querySelector("button").onclick = () => { actionFn(); toast.remove(); };
  setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 300); }, 4000);
}

function hideGame(id, name) {
  hiddenGames.add(id); localStorage.setItem('steam_hidden', JSON.stringify(Array.from(hiddenGames)));
  showToast(`Игра <b>${esc(name)}</b> скрыта`, "Отменить", () => { hiddenGames.delete(id); localStorage.setItem('steam_hidden', JSON.stringify(Array.from(hiddenGames))); apply(); });
  apply(); 
}
function restoreGame(id) { hiddenGames.delete(id); localStorage.setItem('steam_hidden', JSON.stringify(Array.from(hiddenGames))); apply(); }
function toggleFav(id) { if(favGames.has(id)) favGames.delete(id); else favGames.add(id); localStorage.setItem('steam_fav', JSON.stringify(Array.from(favGames))); apply(); }

var tok=0; const delay = ms => new Promise(res => setTimeout(res, ms));
let allTags = new Set();

async function load(){
  let cachedData = localStorage.getItem('steam_cache_data');
  let cacheTime = localStorage.getItem('steam_cache_time');
  if (cachedData && cacheTime && (Date.now() - cacheTime < 30 * 60 * 1000)) {
      data = JSON.parse(cachedData); $("status").textContent = "Загружено из кэша · " + data.items.length + " игр"; apply(); backgroundLoad(true); return;
  }
  $("tb").innerHTML='<tr><td colspan="8"><div class="msg"><div class="sp"></div>Собираю скидки (первые 200 игр)...</div></td></tr>';
  backgroundLoad(false);
}

async function backgroundLoad(isSilent){
  var my=++tok,cc=$("reg").value,start=0,total=1,map=new Map(),first=true;
  try{
    while(start<total && start<2000){
      var r=await fetch("/api/deals?cc="+cc+"&start="+start);
      var t=await r.text(),j; try{j=JSON.parse(t)}catch(x){ throw new Error("Ошибка сервера"); }
      if(my!==tok)return; if(!r.ok) break;
      j.items.forEach(function(g){ map.set(g.i,g); if(g.t) g.t.forEach(tag => allTags.add(tag)); });
      total=j.total;start=j.next;
      if(first) { first = false; data = { cc: cc, cur: j.cur, total: total, items: Array.from(map.values()) }; fillTags(allTags); apply(); $("status").textContent = "Live · Догружаю игры в фоне..."; }
      if(!isSilent && start < total && start < 2000) await delay(1000); 
      if(!start)break;
    }
    data = { cc: cc, cur: data ? data.cur : "RUB", total: map.size, items: Array.from(map.values()) };
    fillTags(allTags); apply();
    localStorage.setItem('steam_cache_data', JSON.stringify(data)); localStorage.setItem('steam_cache_time', Date.now());
    $("status").textContent = "Live · " + map.size + " игр · обновлено в " + new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    if(!data) $("tb").innerHTML='<tr><td colspan="8"><div class="msg">Ошибка: '+esc(String(e.message))+'</div></td></tr>';
    $("status").textContent="Нет связи со Steam";
  }
}

function fillTags(tagSet) {
  const sel = $("tagFilter"); const currVal = sel.value; sel.innerHTML = '<option value="all">Все жанры</option>';
  Array.from(tagSet).sort().forEach(tag => { let opt = document.createElement("option"); opt.value = tag; opt.textContent = tag; sel.appendChild(opt); });
  sel.value = currVal; 
}

function apply(){
  if(!data)return;
  saveFilters();
  var q=$("q").value.trim().toLowerCase(),md=+$("md").value,mp=parseFloat($("mp").value),ru=$("ruFilter").checked,tag=$("tagFilter").value, baseOnly=$("baseGameFilter").checked;
  
  if (showHiddenOnly) {
    list = data.items.filter(g => hiddenGames.has(g.i)); $("count").textContent = "🗑 Скрытые игры: " + list.length;
  } else if (showFavOnly) {
    list = data.items.filter(g => favGames.has(g.i)); $("count").textContent = "⭐ Избранные игры: " + list.length;
  } else {
    list = data.items.filter(function(g){
      let matchTag = (tag === "all") || (g.t && g.t.includes(tag));
      let matchRu = !ru || g.lang_ru;
      let matchBase = !baseOnly || (!g.n.toLowerCase().includes("soundtrack") && !g.n.toLowerCase().includes("dlc") && !g.n.toLowerCase().includes("artbook"));
      return !hiddenGames.has(g.i) && g.d>=md && (isNaN(mp)||g.p<=mp) && (!q||g.n.toLowerCase().indexOf(q)>-1) && matchRu && matchTag && matchBase;
    });

    if (isSoonMode) { list = list.filter(g => g.end && (g.end - Date.now()/1000) < 86400); $("count").textContent = "⏳ Скидки сгорают за 24 часа: " + list.length; }
    else if (isProfitMode) { list.sort((a,b) => (b.d/b.p) - (a.d/a.p)); $("count").textContent = "💎 Сортировка по выгоде"; }
    else if (isRecMode) { list.sort((a, b) => (b.d * b.r) - (a.d * a.r)); list = list.slice(0, 15); $("count").textContent = "🔥 Рекомендации (Топ-15)"; }
    else {
      list.sort(function(a,b){ var x=a[sk],y=b[sk]; if(sk==="n") return dir*x.localeCompare(y); return x===y?b.v-a.v:dir*(x-y) });
      $("count").textContent="Найдено "+list.length+" игр";
    }
  }

  [].forEach.call(document.querySelectorAll("th"),function(t){if(t.dataset.k) t.classList.toggle("on",t.dataset.k===sk)});
  $("tb").innerHTML="";shown=0;more();
}

function more(){
  var end=Math.min(shown+PAGE,list.length),tb=$("tb"); var oldEnd = tb.querySelector('.end-row'); if(oldEnd) oldEnd.remove();

  for(var i=shown;i<end;i++){
    var g=list[i],tr=document.createElement("tr");tr.className="row";tr.style.transitionDelay=((i-shown)%12)*35+"ms";
    var cls=g.d>=75?"":g.d>=40?" m":" l",col=g.r>=80?"var(--accent2)":g.r>=60?"#f1c40f":"#e74c3c";
    var safeId = String(g.i).trim(), safeName = String(g.n).replace(/'/g, "\\'").replace(/"/g, '\\"');
    var shortName = esc(g.n).substring(0, 20) + (g.n.length > 20 ? '...' : '');
    var isFav = favGames.has(g.i), favStar = isFav ? '<span style="color:var(--gold);">★</span>' : '☆';
    var tagList = g.t ? g.t.slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('') : '';
    var timerText = getTimerText(g.end);
    var imgHtml = '<div class="img-box"><span>' + shortName + '</span><img loading="lazy" alt="" src="https://cdn.cloudflare.steamstatic.com/steam/apps/' + safeId + '/header.jpg" onerror="this.style.display=\'none\';"></div>';
    
    // Ссылки на HLTB и Копирование
    var hltbLink = `<a href="https://howlongtobeat.com/?q=${encodeURIComponent(g.n)}" target="_blank" class="hltb" title="Узнать время прохождения">⏱ HLTB</a>`;
    var copyBtn = `<button class="btn-act" style="font-size:14px;color:var(--muted);" onclick="copyLink(${safeId}, this)" title="Скопировать ссылку">🔗</button>`;

    var actionBtn = showHiddenOnly ? `<button class="btn-act" style="color:var(--accent2);" onclick="restoreGame(${safeId})">↩</button>` : `<button class="btn-act" style="color:var(--danger);" title="Скрыть" onclick="hideGame(${safeId}, '${safeName}')">✖</button>`;

    tr.innerHTML = `
    <td style="text-align:center;"><button class="btn-act" style="color:${isFav?'var(--gold)':'var(--muted)'};font-size:22px;" onclick="toggleFav(${safeId})">${favStar}</button></td>
    <td class="g"><div class="gi">${imgHtml}<div><a target="_blank" href="https://store.steampowered.com/app/${safeId}/?cc=${data.cc}">${esc(g.n)}</a><div>${tagList}${hltbLink}</div><div class="timer" style="margin-top:2px;">${timerText}</div></div></div></td>
    <td><span class="pill${cls}">−${g.d}%</span></td>
    <td><b class="pr">${money(g.p)}</b></td>
    <td><div class="rt"><div class="rb"><i data-w="${g.r}" style="background:${col}"></i></div>${g.r}%</div></td>
    <td>${g.v.toLocaleString("ru-RU")}</td>
    <td><button class="btn-act" style="font-size:12px;background:var(--surface);border:1px solid var(--border);padding:4px 8px;border-radius:4px;color:var(--muted);" onclick="checkOnline(${safeId}, this)">Узнать</button></td>
    <td style="text-align:center; white-space:nowrap;">${copyBtn} ${actionBtn}</td>`;
    tb.appendChild(tr);io.observe(tr);
  }
  shown=end;
  if (shown >= list.length) {
    $("more").style.display = "none";
    if (list.length > 0) { var endRow = document.createElement("tr"); endRow.className = "end-row"; endRow.innerHTML = '<td colspan="8">🏁 Это все игры, которые удалось найти</td>'; tb.appendChild(endRow); }
  } else { $("more").style.display = "block"; }
}

[].forEach.call(document.querySelectorAll("th"),function(t){t.onclick=function(){if(!t.dataset.k)return;var k=t.dataset.k;if(sk===k)dir=-dir;else{sk=k;dir=k==="n"||k==="p"||k==="o"?1:-1}
  if(isRecMode) { isRecMode = false; $("btnRec").classList.remove('active'); $("btnRec").textContent = "🔥 Рекомендации"; }
  apply()
}});

["q","md","mp","ruFilter","tagFilter","baseGameFilter"].forEach(function(i){$(i).oninput=apply; $(i).onchange=apply;});
$("more").onclick=more; $("refresh").onclick=function(){ localStorage.removeItem('steam_cache_data'); load(); };

$("btnRec").onclick=function(){ isRecMode = !isRecMode; showHiddenOnly = false; showFavOnly = false; isSoonMode = false; isProfitMode = false; $("btnFav").classList.remove('active'); $("btnShowHidden").classList.remove('active'); $("btnSoon").classList.remove('active'); $("btnProfit").classList.remove('active'); this.classList.toggle('active', isRecMode); this.textContent = isRecMode ? "⏹ Стоп" : "🔥 Рекомендации"; apply(); };
$("btnFav").onclick=function(){ showFavOnly = !showFavOnly; isRecMode = false; showHiddenOnly = false; isSoonMode = false; isProfitMode = false; $("btnRec").classList.remove('active'); $("btnShowHidden").classList.remove('active'); $("btnSoon").classList.remove('active'); $("btnProfit").classList.remove('active'); this.classList.toggle('active', showFavOnly); apply(); };
$("btnShowHidden").onclick=function(){ showHiddenOnly = !showHiddenOnly; isRecMode = false; showFavOnly = false; isSoonMode = false; isProfitMode = false; $("btnFav").classList.remove('active'); $("btnRec").classList.remove('active'); $("btnSoon").classList.remove('active'); $("btnProfit").classList.remove('active'); this.classList.toggle('active', showHiddenOnly); apply(); };

// Новые кнопки
$("btnSoon").onclick=function(){ isSoonMode = !isSoonMode; isRecMode = false; showFavOnly = false; showHiddenOnly = false; isProfitMode = false; $("btnRec").classList.remove('active'); $("btnFav").classList.remove('active'); $("btnShowHidden").classList.remove('active'); $("btnProfit").classList.remove('active'); this.classList.toggle('active', isSoonMode); apply(); };
$("btnProfit").onclick=function(){ isProfitMode = !isProfitMode; isRecMode = false; showFavOnly = false; showHiddenOnly = false; isSoonMode = false; $("btnRec").classList.remove('active'); $("btnFav").classList.remove('active'); $("btnShowHidden").classList.remove('active'); $("btnSoon").classList.remove('active'); this.classList.toggle('active', isProfitMode); apply(); };
$("btnRandom").onclick=function(){ if(list.length > 0) { const r = list[Math.floor(Math.random() * list.length)]; openModal(r); } else { showToast("Список пуст", "OK", ()=>{}); } };

$("btnReset").onclick=function(){ $("q").value=""; $("md").value="0"; $("mp").value=""; $("ruFilter").checked=false; $("tagFilter").value="all"; $("baseGameFilter").checked=false; isRecMode=false; showFavOnly=false; showHiddenOnly=false; isSoonMode=false; isProfitMode=false; $("btnRec").classList.remove('active'); $("btnFav").classList.remove('active'); $("btnShowHidden").classList.remove('active'); $("btnSoon").classList.remove('active'); $("btnProfit").classList.remove('active'); apply(); };
$("reg").onchange=function(){saveFilters(); localStorage.removeItem('steam_cache_data'); load()};
load();
</script>
